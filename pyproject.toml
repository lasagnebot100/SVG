[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plotart"
version = "1.0.0"
description = "Generative Kunst mit Python – p5-ähnliche Skizzen-Sprache, Live-Studio, SVG/PNG/Plotter-Export"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
png = ["Pillow"]
full = ["Pillow", "numpy", "imageio-ffmpeg"]
video = ["Pillow", "imageio-ffmpeg"]

[project.scripts]
plotart = "plotart.cli:main"

[tool.setuptools.packages.find]
include = ["plotart*"]

[tool.setuptools.package-data]
plotart = ["static/*.html", "static/vendor/*", "sketch/examples/*.py"]
