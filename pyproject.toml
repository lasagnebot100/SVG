[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plotart"
version = "1.0.0"
description = "Generative SVG-Kunst für Stiftplotter – reines Python, mit Web-Oberfläche"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
png = ["Pillow"]

[project.scripts]
plotart = "plotart.cli:main"

[tool.setuptools.packages.find]
include = ["plotart*"]

[tool.setuptools.package-data]
plotart = ["static/*.html"]
